<main class="w-full max-w-container-max mx-auto bg-surface-container-lowest rounded-xl shadow-[0_4px_6px_-1px_rgba(0,0,0,0.1),0_2px_4px_-2px_rgba(0,0,0,0.1)] p-stack-md md:p-stack-lg relative overflow-hidden">
  <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-primary-container"></div>

  <div class="mb-stack-lg text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-primary-container text-on-primary-container rounded-full mb-4">
      <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">person_add</span>
    </div>
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Crear Cuenta</h1>
    <p class="font-body-md text-body-md text-on-surface-variant mt-2">Únete a AuthSystem de forma segura.</p>
  </div>

  <form class="flex flex-col gap-stack-md" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div>
      <label class="block font-label-md text-label-md text-on-surface mb-base" for="fullName">Nombre Completo</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <span class="material-symbols-outlined text-outline">person</span>
        </div>
        <input id="fullName" type="text" formControlName="fullName"
          class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
          placeholder="Ej. Juan Pérez" />
      </div>
    </div>

    <div>
      <label class="block font-label-md text-label-md text-on-surface mb-base" for="email">Correo Electrónico</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <span class="material-symbols-outlined text-outline">mail</span>
        </div>
        <input id="email" type="email" formControlName="email"
          class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
          placeholder="correo@ejemplo.com" />
      </div>
    </div>

    <div>
      <label class="block font-label-md text-label-md text-on-surface mb-base" for="password">Contraseña</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <span class="material-symbols-outlined text-outline">lock</span>
        </div>
        <input id="password" type="password" formControlName="password"
          class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
          placeholder="••••••••" />
      </div>
    </div>

    <div>
      <label class="block font-label-md text-label-md text-on-surface mb-base" for="confirmPassword">Confirmar Contraseña</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <span class="material-symbols-outlined text-outline">lock_reset</span>
        </div>
        <input id="confirmPassword" type="password" formControlName="confirmPassword"
          class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
          placeholder="••••••••" />
      </div>
    </div>

    <div>
      <label class="block font-label-md text-label-md text-on-surface mb-base">Rol de Usuario (Demo)</label>
      <div class="grid grid-cols-2 gap-4">
        <label class="relative flex cursor-pointer">
          <input class="peer sr-only" type="radio" formControlName="role" value="user" />
          <div class="w-full p-4 border border-outline-variant rounded-lg text-center peer-checked:bg-primary-container peer-checked:border-primary peer-checked:text-on-primary-container transition-all text-on-surface-variant">
            <span class="material-symbols-outlined block mb-1">person</span>
            <span class="font-label-md text-label-md block">User</span>
          </div>
        </label>
        <label class="relative flex cursor-pointer">
          <input class="peer sr-only" type="radio" formControlName="role" value="admin" />
          <div class="w-full p-4 border border-outline-variant rounded-lg text-center peer-checked:bg-primary-container peer-checked:border-primary peer-checked:text-on-primary-container transition-all text-on-surface-variant">
            <span class="material-symbols-outlined block mb-1">admin_panel_settings</span>
            <span class="font-label-md text-label-md block">Admin</span>
          </div>
        </label>
      </div>
    </div>

    <p *ngIf="errorMessage" class="text-error font-label-sm text-label-sm text-center">{{ errorMessage }}</p>

    <button type="submit" class="w-full h-12 flex items-center justify-center bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary/90 transition-all mt-2">
      Registrarse
    </button>
  </form>

  <div class="mt-stack-md text-center">
    <p class="font-body-md text-body-md text-on-surface-variant">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-primary font-label-md text-label-md hover:underline px-1">Volver a Login</a>
    </p>
  </div>
</main>
