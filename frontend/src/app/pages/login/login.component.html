<main class="w-full max-w-container-max mx-auto">
  <div
    class="bg-surface-container-lowest rounded-[12px] shadow-[0_4px_6px_-1px_rgba(0,0,0,0.1),0_2px_4px_-2px_rgba(0,0,0,0.1)] p-stack-md md:p-stack-lg flex flex-col gap-stack-lg"
  >

    <div class="flex flex-col items-center text-center gap-stack-sm">
      <div
        class="h-12 w-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary mb-2"
      >
        <span
          class="material-symbols-outlined text-[28px]"
          style="font-variation-settings: 'FILL' 1;"
        >
          shield_lock
        </span>
      </div>

      <h1
        class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface"
      >
        Acceso al Sistema
      </h1>

      <p class="font-body-md text-body-md text-on-surface-variant">
        Ingresa tus credenciales para continuar de forma segura.
      </p>
    </div>

    <form
      class="flex flex-col gap-stack-md"
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
    >

      <!-- Correo electrónico -->
      <div class="flex flex-col gap-base">
        <label
          class="font-label-md text-label-md text-on-surface"
          for="email"
        >
          Correo Electrónico
        </label>

        <div class="relative group">
          <span
            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors"
          >
            mail
          </span>

          <input
            id="email"
            type="email"
            formControlName="email"
            class="w-full h-12 pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary focus:outline-none transition-all placeholder:text-outline-variant/60"
            placeholder="tu@empresa.com"
          />
        </div>
      </div>

      <!-- Contraseña -->
      <div class="flex flex-col gap-base">
        <div class="flex justify-between items-center">
          <label
            class="font-label-md text-label-md text-on-surface"
            for="password"
          >
            Contraseña
          </label>
        </div>

        <div class="relative group">
          <span
            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors"
          >
            lock
          </span>

          <input
            id="password"
            type="password"
            formControlName="password"
            class="w-full h-12 pl-10 pr-10 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary focus:outline-none transition-all placeholder:text-outline-variant/60"
            placeholder="••••••••"
          />
        </div>
      </div>

      <!-- Mensaje de error -->
      <p
        *ngIf="errorMessage"
        class="text-error font-label-sm text-label-sm text-center"
      >
        {{ errorMessage }}
      </p>

      <!-- Botones -->
      <div class="flex flex-col gap-stack-sm pt-4">

        <!-- Iniciar sesión -->
        <button
          type="submit"
          class="h-12 w-full bg-primary text-on-primary font-label-md text-label-md rounded-DEFAULT hover:bg-primary-fixed-dim hover:shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2"
        >
          <span>Iniciar Sesión</span>

          <span class="material-symbols-outlined text-[20px]">
            arrow_forward
          </span>
        </button>

        <!-- Crear cuenta -->
        <a
          routerLink="/register"
          class="h-12 w-full bg-surface-container-lowest border border-slate-600 text-on-surface font-label-md text-label-md rounded-DEFAULT hover:bg-surface-container-low transition-all active:scale-[0.98] flex items-center justify-center"
        >
          Crear una cuenta
        </a>

      </div>
    </form>
  </div>

  <!-- Seguridad -->
  <div
    class="mt-stack-md flex justify-center items-center gap-4 text-on-surface-variant/60"
  >
    <span class="material-symbols-outlined text-[20px]">
      verified_user
    </span>

    <p class="font-label-sm text-label-sm">
      Autenticación Segura de Extremo a Extremo
    </p>
  </div>
</main>
